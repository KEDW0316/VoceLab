name: Release build (Windows / macOS)

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 수동 실행(빌드 점검용)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller packaging/vocelab.spec

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/dmg
          cp -R dist/VoceLab.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "VoceLab" -srcfolder dist/dmg -ov -format UDZO dist/VoceLab.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoceLab-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            dist/VoceLab-Setup.exe
            dist/VoceLab.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            dist/VoceLab-Setup.exe
            dist/VoceLab.dmg
