name: 💡 Feature / idea
description: Suggest a metric, scale, or workflow improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like, and how would it help your practice?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Are you a singer, coach, researcher…? Any source/reference for a metric?
