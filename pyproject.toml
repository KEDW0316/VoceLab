[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocelab"
version = "0.1.0"
description = "보컬 트레이닝 보조 앱 — 오디오 인터페이스 녹음/모니터링 + Praat 기반 음향 분석"
requires-python = ">=3.11"
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "pywebview>=5.0",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "praat-parselmouth>=0.4.3",
]

[project.scripts]
vocelab = "vocelab.webapp:main"
vocelab-qt = "vocelab.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
